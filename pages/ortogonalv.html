<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vectores Ortogonales y Producto Punto</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            max-width: 900px;
        }
        canvas {
            background-color: #ffffff;
            border: 1px solid #ccc;
            border-radius: 8px;
            cursor: crosshair;
        }
        .controls-panel {
            display: flex;
            flex-direction: column;
            min-width: 300px;
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
            font-size: 1.5rem;
        }
        .vector-control {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #ccc;
        }
        .vector-u { border-left-color: #3498db; }
        .vector-v { border-left-color: #e74c3c; }
        
        .slider-group {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .slider-group label {
            width: 30px;
            font-weight: bold;
        }
        input[type="range"] {
            flex-grow: 1;
            margin: 0 10px;
        }
        .val-display {
            width: 30px;
            text-align: right;
            font-family: monospace;
            font-size: 1.1em;
        }
        .results {
            background: #eef2f5;
            padding: 15px;
            border-radius: 8px;
            margin-top: auto;
        }
        .results p {
            margin: 5px 0;
            font-size: 1.1rem;
        }
        .formula {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: #2c3e50;
        }
        .alert {
            display: none;
            background-color: #2ecc71;
            color: white;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="container">
    <div>
        <canvas id="vectorCanvas" width="400" height="400"></canvas>
    </div>
    
    <div class="controls-panel">
        <h2>Control de Vectores</h2>
        
        <div class="vector-control vector-u">
            <h3 style="margin-top:0; color:#2980b9;">Vector U</h3>
            <div class="slider-group">
                <label>X:</label>
                <input type="range" id="u_x" min="-5" max="5" step="0.5" value="3">
                <span id="u_x_val" class="val-display">3</span>
            </div>
            <div class="slider-group">
                <label>Y:</label>
                <input type="range" id="u_y" min="-5" max="5" step="0.5" value="2">
                <span id="u_y_val" class="val-display">2</span>
            </div>
        </div>

        <div class="vector-control vector-v">
            <h3 style="margin-top:0; color:#c0392b;">Vector V</h3>
            <div class="slider-group">
                <label>X:</label>
                <input type="range" id="v_x" min="-5" max="5" step="0.5" value="-2">
                <span id="v_x_val" class="val-display">-2</span>
            </div>
            <div class="slider-group">
                <label>Y:</label>
                <input type="range" id="v_y" min="-5" max="5" step="0.5" value="3">
                <span id="v_y_val" class="val-display">3</span>
            </div>
        </div>

        <div class="results">
            <p>Producto Punto ($U \cdot V$): <span id="dot_product" class="formula">0</span></p>
            <p>Ángulo ($\theta$): <span id="angle_display" class="formula">90°</span></p>
            <div id="orthogonal_alert" class="alert">¡Vectores Ortogonales!</div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('vectorCanvas');
    const ctx = canvas.getContext('2d');
    const gridSize = 40; // Pixeles por unidad
    const originX = canvas.width / 2;
    const originY = canvas.height / 2;

    const inputs = {
        ux: document.getElementById('u_x'),
        uy: document.getElementById('u_y'),
        vx: document.getElementById('v_x'),
        vy: document.getElementById('v_y')
    };
    const displays = {
        ux: document.getElementById('u_x_val'),
        uy: document.getElementById('u_y_val'),
        vx: document.getElementById('v_x_val'),
        vy: document.getElementById('v_y_val')
    };
    const dotProductDisplay = document.getElementById('dot_product');
    const angleDisplay = document.getElementById('angle_display');
    const alertBox = document.getElementById('orthogonal_alert');

    function toCanvasCoords(x, y) {
        return {
            cx: originX + x * gridSize,
            cy: originY - y * gridSize
        };
    }

    function drawGrid() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.lineWidth = 1;
        
        for(let i = 0; i <= canvas.width; i += gridSize) {
            ctx.beginPath();
            ctx.moveTo(i, 0);
            ctx.lineTo(i, canvas.height);
            ctx.strokeStyle = '#e0e0e0';
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(0, i);
            ctx.lineTo(canvas.width, i);
            ctx.strokeStyle = '#e0e0e0';
            ctx.stroke();
        }

        ctx.lineWidth = 2;
        ctx.strokeStyle = '#2c3e50';
        ctx.beginPath();
        ctx.moveTo(originX, 0);
        ctx.lineTo(originX, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, originY);
        ctx.lineTo(canvas.width, originY);
        ctx.stroke();
    }

    function drawArrow(fromX, fromY, toX, toY, color) {
        const start = toCanvasCoords(fromX, fromY);
        const end = toCanvasCoords(toX, toY);
        const headlen = 10; 
        const dx = end.cx - start.cx;
        const dy = end.cy - start.cy;
        const angle = Math.atan2(dy, dx);

        ctx.beginPath();
        ctx.moveTo(start.cx, start.cy);
        ctx.lineTo(end.cx, end.cy);
        ctx.lineTo(end.cx - headlen * Math.cos(angle - Math.PI / 6), end.cy - headlen * Math.sin(angle - Math.PI / 6));
        ctx.moveTo(end.cx, end.cy);
        ctx.lineTo(end.cx - headlen * Math.cos(angle + Math.PI / 6), end.cy - headlen * Math.sin(angle + Math.PI / 6));
        
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.stroke();
    }

    function drawAngleIndicator(ux, uy, vx, vy, isOrthogonal) {
        const magU = Math.sqrt(ux*ux + uy*uy);
        const magV = Math.sqrt(vx*vx + vy*vy);
        
        if (magU === 0 || magV === 0) return;

        // Ángulos en el canvas (Y invertido)
        const angleU = Math.atan2(-uy, ux);
        const angleV = Math.atan2(-vy, vx);

        ctx.beginPath();
        
        if (isOrthogonal) {
            // Dibuja el cuadrado de 90 grados
            const size = 15; // Tamaño del símbolo
            const dirUx = ux / magU;
            const dirUy = -uy / magU;
            const dirVx = vx / magV;
            const dirVy = -vy / magV;

            const p1x = originX + dirUx * size;
            const p1y = originY + dirUy * size;
            const p2x = p1x + dirVx * size;
            const p2y = p1y + dirVy * size;
            const p3x = originX + dirVx * size;
            const p3y = originY + dirVy * size;

            ctx.moveTo(p1x, p1y);
            ctx.lineTo(p2x, p2y);
            ctx.lineTo(p3x, p3y);
            ctx.strokeStyle = '#27ae60'; // Verde para resaltar
            ctx.lineWidth = 2;
            ctx.stroke();
        } else {
            // Dibuja el arco para ángulos regulares
            const radius = 25;
            let start = angleU;
            let end = angleV;
            
            // Asegurar que siempre se dibuje el ángulo menor (interior)
            if (end < start) {
                let temp = start;
                start = end;
                end = temp;
            }
            let isLargeArc = (end - start) > Math.PI;

            ctx.arc(originX, originY, radius, start, end, isLargeArc);
            ctx.strokeStyle = '#f39c12'; // Naranja
            ctx.lineWidth = 2;
            ctx.stroke();
        }
    }

    function update() {
        const ux = parseFloat(inputs.ux.value);
        const uy = parseFloat(inputs.uy.value);
        const vx = parseFloat(inputs.vx.value);
        const vy = parseFloat(inputs.vy.value);

        displays.ux.textContent = ux;
        displays.uy.textContent = uy;
        displays.vx.textContent = vx;
        displays.vy.textContent = vy;

        drawGrid();

        const dotProduct = (ux * vx) + (uy * vy);
        const magU = Math.sqrt(ux*ux + uy*uy);
        const magV = Math.sqrt(vx*vx + vy*vy);
        
        let angleDeg = 0;
        if (magU > 0 && magV > 0) {
            let cosTheta = dotProduct / (magU * magV);
            cosTheta = Math.max(-1, Math.min(1, cosTheta));
            const angleRad = Math.acos(cosTheta);
            angleDeg = (angleRad * 180 / Math.PI).toFixed(1);
        }

        dotProductDisplay.textContent = dotProduct.toFixed(2);
        angleDisplay.textContent = `${angleDeg}°`;

        const isOrthogonal = Math.abs(dotProduct) < 0.01 && magU > 0 && magV > 0;

        if (isOrthogonal) {
            alertBox.style.display = 'block';
            dotProductDisplay.style.color = '#27ae60';
        } else {
            alertBox.style.display = 'none';
            dotProductDisplay.style.color = '#2c3e50';
        }

        // Dibujar indicador de ángulo (se dibuja primero para quedar debajo de las flechas)
        drawAngleIndicator(ux, uy, vx, vy, isOrthogonal);

        // Dibujar vectores
        drawArrow(0, 0, ux, uy, '#3498db'); 
        drawArrow(0, 0, vx, vy, '#e74c3c'); 
    }

    Object.values(inputs).forEach(input => {
        input.addEventListener('input', update);
    });

    update();
</script>

</body>
</html>
